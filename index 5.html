.wrap{max-width:720px;margin:auto;position:relative;z-index:2}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font:700 30px 'Barlow Condensed',sans-serif;letter-spacing:.4px}
.date{font-size:13px;opacity:.75;margin-top:-2px}

.day{font:600 13px Barlow;color:var(--mute);margin:14px 4px 8px}
.card{position:relative;background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(10,40,25,.07),0 6px 16px -8px rgba(10,40,25,.18);overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--g2)}
.card.lv::before{background:var(--red)}.card.up::before{background:var(--gold)}
.open{all:unset;display:block;width:100%;box-sizing:border-box;padding:12px 44px 12px 16px;cursor:pointer}

.meta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mute);margin-bottom:8px}

.sc{font:700 22px 'Barlow Condensed',sans-serif;letter-spacing:.3px}
.tick{color:var(--g2);font-weight:700}
.lose .nm,.lose .sc{color:var(--mute);font-weight:500}

.res{color:var(--red)}.pill{background:var(--chip);color:var(--gold);padding:2px 10px;border-radius:12px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:pl 1.4s ease-in-out infinite}

.note{font-size:12px;color:var(--mute);text-align:center;margin-top:18px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}

.nav button[aria-selected=true]{color:var(--g2)}
.nav b{position:absolute;top:0;left:55%;background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;line-height:15px}
.sheet{position:fixed;inset:0;z-index:30;display:none;background:rgba(4,12,8,.6)}
.sheet.on{display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;animation:up .25s ease-out;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
